<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>پیگیری سفارش | 7BOX</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{--bg:#08060f;--surface:rgba(255,255,255,.04);--surface-2:rgba(255,255,255,.07);--border:rgba(255,255,255,.08);--border-2:rgba(255,255,255,.16);--text:#f5f5f7;--muted:#9a9ba3;--muted-2:#6b6d76;--accent:#a78bfa;--accent-2:#7c3aed;--accent-3:#c4b5fd;--accent-soft:rgba(167,139,250,.15);--accent-line:rgba(167,139,250,.35);--gold:#fbbf24;--radius:16px;--radius-lg:22px;--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Vazirmatn,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;line-height:1.75;-webkit-font-smoothing:antialiased;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-5;pointer-events:none;background:radial-gradient(1200px 800px at 80% -10%,rgba(167,139,250,.12),transparent 60%),radial-gradient(900px 600px at 10% 30%,rgba(251,191,36,.04),transparent 55%),linear-gradient(180deg,rgba(8,6,15,.6),rgba(8,6,15,.95))}
.wrap{max-width:1200px;margin:auto;padding:0 20px}
.site-nav{position:sticky;top:0;z-index:50;background:rgba(8,6,15,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;height:66px;position:relative}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:900;font-size:20px;letter-spacing:1px}
.nav-brand img{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(167,139,250,.4))}
.nav-brand span{background:linear-gradient(135deg,var(--accent),var(--accent-3));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-links{display:flex;gap:4px;list-style:none;align-items:center}
.nav-links a{padding:8px 14px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:600;transition:.2s var(--ease)}
.nav-links a:hover{color:var(--text);background:var(--surface)}
.nav-links a.active{color:var(--accent);background:var(--accent-soft)}
.nav-toggle{display:none;background:none;border:none;color:var(--text);font-size:24px;cursor:pointer;padding:6px}
.banners-section{padding:20px 0 0}
.banner-carousel{position:relative;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);box-shadow:0 25px 70px rgba(0,0,0,.5);isolation:isolate}
.banner-track{display:flex;transition:transform .7s var(--ease);will-change:transform}
.banner-slide{min-width:100%;position:relative;aspect-ratio:2.6/1;background-size:cover;background-position:center;display:flex;align-items:center}
.banner-slide:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,6,15,.82) 0%,rgba(8,6,15,.35) 55%,transparent 100%);pointer-events:none}
.banner-content{position:relative;z-index:2;padding:clamp(20px,5vw,50px);max-width:60%;color:#fff}
.banner-content h3{font-size:clamp(20px,3.4vw,34px);font-weight:800;margin-bottom:10px;line-height:1.3;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.banner-content p{font-size:clamp(13px,1.6vw,16px);color:#dcdde2;margin-bottom:18px;text-shadow:0 2px 15px rgba(0,0,0,.5)}
.banner-cta{display:inline-block;padding:10px 22px;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-weight:800;font-size:13px;box-shadow:0 8px 25px rgba(167,139,250,.4)}
.banner-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.45);color:#fff;cursor:pointer;backdrop-filter:blur(10px);z-index:3;font-size:22px;transition:.25s;display:flex;align-items:center;justify-content:center}
.banner-nav:hover{background:rgba(0,0,0,.75)}
.banner-nav.prev{right:14px}
.banner-nav.next{left:14px}
.banner-dots{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:3}
.banner-dot{width:9px;height:9px;border-radius:50%;border:none;background:rgba(255,255,255,.4);cursor:pointer;padding:0;transition:.3s}
.banner-dot.active{background:var(--accent);width:26px;border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:999px;font-family:inherit;font-size:14px;font-weight:700;text-decoration:none;border:1px solid var(--border-2);background:var(--surface-2);color:var(--text);cursor:pointer;transition:.25s var(--ease);backdrop-filter:blur(10px)}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.12);border-color:var(--accent-line)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:none;box-shadow:0 8px 25px rgba(167,139,250,.35)}
.btn-primary:hover{box-shadow:0 12px 35px rgba(167,139,250,.5)}
section{padding:70px 0;position:relative}
.section-head{text-align:center;margin-bottom:40px}
.section-head h2{font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.5px;margin-bottom:10px}
.section-head h2 .em{background:linear-gradient(135deg,var(--accent),var(--accent-3));-webkit-background-clip:text;background-clip:text;color:transparent}
.section-head p{color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .3s var(--ease),border-color .3s,box-shadow .3s;position:relative}
.card:hover{transform:translateY(-5px);border-color:var(--accent-line);box-shadow:0 20px 45px rgba(0,0,0,.5),0 0 0 1px rgba(167,139,250,.15)}
.card-media{position:relative;aspect-ratio:1/1;background:#0a0812;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card-media img{width:100%;height:100%;object-fit:contain;padding:18px;transition:transform .5s var(--ease)}
.card:hover .card-media img{transform:scale(1.06)}
.card-badge{position:absolute;top:12px;right:12px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent-3);border:1px solid var(--accent-line);backdrop-filter:blur(8px)}
.card-body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-cat{font-size:11px;color:var(--muted-2);font-weight:600;letter-spacing:.5px}
.card-title{font-size:15px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.card-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--border)}
.card-price{font-size:13px;font-weight:800;color:var(--text)}
.card-price.inquiry{color:var(--gold);font-size:12px}
.card-btn{padding:8px 14px;border-radius:10px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent-3);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:.2s var(--ease);white-space:nowrap}
.card-btn:hover{background:rgba(167,139,250,.25);border-color:var(--accent)}
.card-btn:active{transform:scale(.96)}
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,.03) 25%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.03) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.sk-media{aspect-ratio:1/1}.sk-body{padding:16px;display:flex;flex-direction:column;gap:10px}
.sk-line{height:12px}.sk-line.short{width:60%}.sk-btn{height:32px;border-radius:10px;margin-top:8px}
.empty-state{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius);background:var(--surface);font-size:14px}
.feature-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:20px}
.feature-item{display:flex;align-items:center;gap:12px;padding:16px 18px;background:linear-gradient(180deg,rgba(167,139,250,.08),rgba(167,139,250,.02));border:1px solid var(--accent-soft);border-radius:14px}
.feature-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-3);font-size:18px;flex-shrink:0}
.feature-item strong{display:block;font-size:14px;margin-bottom:2px}
.feature-item small{color:var(--muted);font-size:12px}
.tracking-box{max-width:620px;margin:auto;padding:32px 24px;border:1px solid var(--border);border-radius:var(--radius-lg);background:linear-gradient(180deg,rgba(167,139,250,.06),rgba(255,255,255,.02));backdrop-filter:blur(14px);box-shadow:0 25px 60px rgba(0,0,0,.4);text-align:center}
.tracking-logo{width:78px;height:78px;object-fit:contain;margin-bottom:14px;filter:drop-shadow(0 0 18px rgba(167,139,250,.35))}
.tracking-box h3{font-size:19px;margin-bottom:8px;font-weight:800}
.tracking-box>p{color:var(--muted);font-size:13px;margin-bottom:22px;line-height:1.9}
.tracking-form{display:flex;gap:10px;align-items:stretch}
.tracking-input{flex:1;min-width:0;padding:14px 16px;border:1px solid var(--border-2);border-radius:12px;background:rgba(0,0,0,.4);color:var(--text);outline:none;font-family:inherit;font-size:14px;text-align:center;direction:ltr;transition:.2s}
.tracking-input::placeholder{color:var(--muted-2)}
.tracking-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tracking-button{padding:0 24px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;transition:.2s;white-space:nowrap}
.tracking-button:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(167,139,250,.35)}
.tracking-button:disabled{opacity:.6;cursor:wait;transform:none}
.tracking-result{display:none;margin-top:22px;padding:22px;border:1px solid var(--border);border-radius:16px;background:rgba(0,0,0,.35);text-align:right}
.tracking-result.show{display:block}
.tracking-error{color:#ffbaba;line-height:2;text-align:center}
.tracking-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--border)}
.tracking-header strong{font-size:15px;font-weight:800}
.status-badge{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent-3)}
.tracking-details{display:grid;gap:10px}
.tracking-row{display:flex;justify-content:space-between;gap:15px;font-size:13px;line-height:1.9}
.tracking-row span:first-child{color:var(--muted)}
.tracking-row span:last-child{color:#e5e5e8;text-align:left;font-weight:600}
.tracking-note{margin-top:14px;padding:12px;border-radius:12px;background:rgba(255,255,255,.05);color:var(--muted);font-size:12px;line-height:2}
.tracking-steps{display:flex;align-items:flex-start;justify-content:space-between;gap:4px;margin-top:24px}
.tracking-step{flex:1;position:relative;text-align:center;font-size:10px;color:var(--muted-2)}
.tracking-step:before{content:"";display:block;width:12px;height:12px;border-radius:50%;margin:0 auto 8px;background:#1f1a2a;border:1px solid #3a2f4a;position:relative;z-index:2}
.tracking-step:after{content:"";position:absolute;height:1px;background:#2a2030;top:6px;right:50%;width:100%;z-index:1}
.tracking-step:first-child:after{display:none}
.tracking-step.active{color:#fff}
.tracking-step.active:before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px rgba(167,139,250,.6)}
.tracking-step.done{color:#a7a8ae}
.tracking-step.done:before{background:#666a73;border-color:#666a73}
.site-footer{text-align:center;padding:40px 20px;color:var(--muted-2);border-top:1px solid var(--border);font-size:13px;margin-top:60px}
.site-footer p{margin-bottom:6px}
.site-footer a{color:var(--accent-3);text-decoration:none}
.site-footer a:hover{text-decoration:underline}
@media(max-width:820px){.nav-toggle{display:block}.nav-links{position:absolute;top:66px;right:0;left:0;background:#0c0918;flex-direction:column;gap:0;padding:10px;border-bottom:1px solid var(--border);transform:translateY(-10px);opacity:0;pointer-events:none;transition:.25s var(--ease)}.nav-links.open{transform:translateY(0);opacity:1;pointer-events:auto}.nav-links a{width:100%;text-align:right;padding:12px 14px}}
@media(max-width:720px){section{padding:55px 0}.banner-slide{aspect-ratio:1.3/1}.banner-content{max-width:85%;padding:22px}.banner-nav{width:36px;height:36px;font-size:18px}.banner-nav.prev{right:8px}.banner-nav.next{left:8px}.banner-dots{bottom:12px;gap:6px}.banner-dot{width:7px;height:7px}.banner-dot.active{width:20px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.card-body{padding:12px}.card-title{font-size:13px}.card-price{font-size:12px}.card-btn{font-size:11px;padding:7px 10px}.card-badge{font-size:10px;padding:3px 8px;top:8px;right:8px}.tracking-form{flex-direction:column}.tracking-input,.tracking-button{height:48px;width:100%}}
@media(max-width:420px){.grid{grid-template-columns:1fr}.card-media{aspect-ratio:1.4/1}}
</style>
</head>

<script>
const API={banners:"/api/banners",products:"/api/products",apps:"/api/apps",books:"/api/books",order:"/api/orders/"};
const FALLBACK_BANNERS=[{title:"تخفیف ویژه پاییزه",subtitle:"تا ۴۰٪ تخفیف روی محصولات منتخب",cta:"مشاهده محصولات",link:"/shop.html",gradient:"linear-gradient(135deg,#4c1d95,#7c3aed)"},{title:"کتاب‌های دیجیتال",subtitle:"دانلود کتاب‌های کاربردی",cta:"خرید کتاب",link:"/library.html",gradient:"linear-gradient(135deg,#7c2d12,#d97706)"},{title:"اپلیکیشن‌ها و بازی‌ها",subtitle:"بهترین اپ‌ها در 7BOX",cta:"مشاهده اپ‌ها",link:"/apps.html",gradient:"linear-gradient(135deg,#1e3a8a,#3b82f6)"}];
const ORDER_STATUSES=["ثبت سفارش","تأیید سفارش","بسته‌بندی","ارسال","تحویل"];
function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function formatPrice(p){if(p===null||p===undefined||p===""||Number(p)<=0)return null;return Number(p).toLocaleString("fa-IR")+" تومان"}
function extractItems(d){if(!d)return[];if(Array.isArray(d))return d;return d.products||d.apps||d.books||d.items||d.banners||[]}
function skeletonCards(n=4){return Array.from({length:n},()=>'<div class="sk-card"><div class="skeleton sk-media"></div><div class="sk-body"><div class="skeleton sk-line short"></div><div class="skeleton sk-line"></div><div class="skeleton sk-btn"></div></div></div>').join("")}
async function loadBanners(){const c=document.getElementById("bannerCarousel");if(!c)return;let b=[];try{const r=await fetch(API.banners,{cache:"no-store"});if(r.ok){const d=await r.json();b=extractItems(d).filter(x=>x&&(x.image||x.title||x.gradient))}}catch(e){}if(!b.length)b=FALLBACK_BANNERS;initBannerCarousel(b)}
function initBannerCarousel(banners){const t=document.getElementById("bannerTrack"),d=document.getElementById("bannerDots"),c=document.getElementById("bannerCarousel");if(!t||!d||!c)return;t.innerHTML="";d.innerHTML="";banners.forEach((b,i)=>{const s=document.createElement("div");s.className="banner-slide";if(b.image)s.style.backgroundImage='url("'+b.image+'")';else if(b.gradient)s.style.background=b.gradient;if(b.title||b.subtitle||b.cta){const ct=document.createElement("div");ct.className="banner-content";ct.innerHTML=(b.title?'<h3>'+escapeHtml(b.title)+'</h3>':"")+(b.subtitle?'<p>'+escapeHtml(b.subtitle)+'</p>':"")+(b.cta?'<span class="banner-cta">'+escapeHtml(b.cta)+'</span>':"");s.appendChild(ct)}if(b.link){s.style.cursor="pointer";s.addEventListener("click",()=>{if(String(b.link).startsWith("#"))document.querySelector(b.link)?.scrollIntoView({behavior:"smooth"});else window.location.href=b.link})}t.appendChild(s);const dot=document.createElement("button");dot.className="banner-dot"+(i===0?" active":"");dot.setAttribute("aria-label","بنر "+(i+1));dot.addEventListener("click",()=>go(i));d.appendChild(dot)});let idx=0,timer=null;const total=banners.length;function go(i){idx=(i+total)%total;t.style.transform="translateX("+(idx*100)+"%)";d.querySelectorAll(".banner-dot").forEach((x,k)=>x.classList.toggle("active",k===idx))}function next(){go(idx+1)}function prev(){go(idx-1)}function start(){if(total<2)return;stop();timer=setInterval(next,5000)}function stop(){if(timer){clearInterval(timer);timer=null}}document.getElementById("bannerNext")?.addEventListener("click",()=>{next();start()});document.getElementById("bannerPrev")?.addEventListener("click",()=>{prev();start()});c.addEventListener("mouseenter",stop);c.addEventListener("mouseleave",start);let sx=0,dx=0;c.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;stop()},{passive:true});c.addEventListener("touchmove",e=>{dx=e.touches[0].clientX-sx},{passive:true});c.addEventListener("touchend",()=>{if(Math.abs(dx)>50)dx>0?prev():next();dx=0;start()});if(total>0)go(0);start()}
function createCard(item,type="product",index=0){const card=document.createElement("article");card.className="card";const p=formatPrice(item.price);const ph=p?'<span class="card-price">'+p+'</span>':'<span class="card-price inquiry">استعلام</span>';const bl=type==="app"?"دریافت":type==="book"?"خرید":"ثبت سفارش";const cat=item.category||(type==="app"?"اپلیکیشن":type==="book"?"کتاب دیجیتال":"محصول 7BOX");const isFirst=index===0;card.innerHTML='<div class="card-media">'+(item.badge?'<span class="card-badge">'+escapeHtml(item.badge)+'</span>':"")+'<img src="'+escapeHtml(item.image||"")+'" alt="'+escapeHtml(item.name||"")+'" width="300" height="300" loading="'+(isFirst?"eager":"lazy")+'" decoding="async" fetchpriority="'+(isFirst?"high":"auto")+'" onerror="this.style.opacity=\'0.2\'"></div><div class="card-body"><span class="card-cat">'+escapeHtml(cat)+'</span><h3 class="card-title">'+escapeHtml(item.name||"بدون عنوان")+'</h3><div class="card-footer">'+ph+'<button class="card-btn" type="button">'+bl+'</button></div></div>';card.querySelector(".card-btn").addEventListener("click",e=>{e.stopPropagation();window.location.href="/order.html?product="+encodeURIComponent(item.id)});return card}
async function loadSection({api,gridId,type,emptyText}){const g=document.getElementById(gridId);if(!g)return;g.innerHTML=skeletonCards(4);try{const r=await fetch(api,{cache:"no-store"});if(!r.ok)throw new Error(r.status);const d=await r.json();const items=extractItems(d);if(!items.length){g.innerHTML='<div class="empty-state">'+emptyText+'</div>';return}g.innerHTML="";items.forEach((item,i)=>g.appendChild(createCard(item,type,i)))}catch(e){g.innerHTML='<div class="empty-state">'+emptyText+'</div>'}}
function showTrackingResult(order){const r=document.getElementById("trackingResult");if(!r)return;const status=String(order.status||"ثبت سفارش").trim();const si=ORDER_STATUSES.indexOf(status);const cur=si>=0?si:0;const steps=ORDER_STATUSES.map((s,i)=>{let cls="";if(i<cur)cls="done";if(i===cur)cls="active";return '<div class="tracking-step '+cls+'">'+s+'</div>'}).join("");const code=order.tracking_code||order.trackingCode||"—";const prod=order.product_name||order.productName||"—";const qty=order.quantity!=null?Number(order.quantity).toLocaleString("fa-IR"):"—";const date=order.created_at||order.createdAt||"—";const note=order.admin_note||order.adminNote||"";r.className="tracking-result show";r.innerHTML='<div class="tracking-header"><strong>وضعیت سفارش</strong><span class="status-badge">'+escapeHtml(status)+'</span></div><div class="tracking-details"><div class="tracking-row"><span>کد رهگیری</span><span>'+escapeHtml(code)+'</span></div><div class="tracking-row"><span>محصول</span><span>'+escapeHtml(prod)+'</span></div><div class="tracking-row"><span>تعداد</span><span>'+escapeHtml(qty)+'</span></div><div class="tracking-row"><span>تاریخ ثبت</span><span>'+escapeHtml(date)+'</span></div></div><div class="tracking-steps">'+steps+'</div>'+(note?'<div class="tracking-note">'+escapeHtml(note)+'</div>':"")}
async function trackOrder(e){e.preventDefault();const input=document.getElementById("trackingCodeInput");const btn=document.getElementById("trackingButton");const r=document.getElementById("trackingResult");const code=input.value.trim();if(!code){r.className="tracking-result show tracking-error";r.innerHTML="لطفاً کد رهگیری را وارد کنید.";return}btn.disabled=true;btn.textContent="در حال بررسی...";r.className="tracking-result show";r.innerHTML="در حال دریافت وضعیت سفارش...";try{const res=await fetch(API.order+encodeURIComponent(code),{cache:"no-store"});let d=null;try{d=await res.json()}catch(_){}if(!res.ok||!d||!d.ok)throw new Error("not found");showTrackingResult(d.order||d)}catch(err){r.className="tracking-result show tracking-error";r.innerHTML="سفارشی با این کد رهگیری پیدا نشد.<br>لطفاً کد را بررسی کنید."}finally{btn.disabled=false;btn.textContent="پیگیری"}}
function initNav(){const t=document.getElementById("navToggle"),l=document.getElementById("navLinks");if(t&&l)t.addEventListener("click",()=>l.classList.toggle("open"))}
document.addEventListener("DOMContentLoaded",()=>{initNav();loadBanners();const y=document.getElementById("year");if(y)y.textContent=new Date().getFullYear();const tf=document.getElementById("trackingForm");if(tf)tf.addEventListener("submit",trackOrder);if(document.getElementById("productsGrid"))loadSection({api:API.products,gridId:"productsGrid",type:"product",emptyText:"در حال حاضر محصولی برای نمایش وجود ندارد."});if(document.getElementById("appsGrid"))loadSection({api:API.apps,gridId:"appsGrid",type:"app",emptyText:"به‌زودی اپلیکیشن‌های جدید اضافه می‌شوند."});if(document.getElementById("booksGrid"))loadSection({api:API.books,gridId:"booksGrid",type:"book",emptyText:"به‌زودی کتاب‌های جدید اضافه می‌شوند."})});
</script>
