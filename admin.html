<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت 7BOX</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #0b0d10;
      color: #f4f4f5;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    .hidden {
      display: none !important;
    }

    .container {
      width: min(1500px, 96%);
      margin: 0 auto;
    }

    header {
      background: #11151a;
      border-bottom: 1px solid #252a31;
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      font-size: 22px;
      font-weight: bold;
    }

    .brand span {
      color: #6ee7b7;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 15px;
      cursor: pointer;
      color: #fff;
      background: #2563eb;
      font-size: 14px;
    }

    .btn:hover {
      opacity: .9;
    }

    .btn.green {
      background: #059669;
    }

    .btn.red {
      background: #dc2626;
    }

    .btn.gray {
      background: #374151;
    }

    .btn.orange {
      background: #d97706;
    }

    .btn.small {
      padding: 7px 10px;
      font-size: 12px;
    }

    .login-box {
      width: min(420px, 94%);
      margin: 90px auto;
      background: #11151a;
      border: 1px solid #252a31;
      border-radius: 18px;
      padding: 25px;
    }

    .login-box h1 {
      margin-top: 0;
      text-align: center;
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: #cbd5e1;
      font-size: 13px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #303640;
      background: #0d1116;
      color: #fff;
      border-radius: 9px;
      padding: 10px;
      outline: none;
      font-size: 14px;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #3b82f6;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
    }

    .checkbox-field input {
      width: auto;
    }

    .message {
      padding: 11px 13px;
      border-radius: 9px;
      margin-bottom: 15px;
      display: none;
      line-height: 1.7;
      font-size: 13px;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #064e3b;
      color: #a7f3d0;
    }

    .message.error {
      background: #7f1d1d;
      color: #fecaca;
    }

    main {
      padding: 25px 0 60px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: #11151a;
      border: 1px solid #252a31;
      border-radius: 15px;
      padding: 18px;
    }

    .stat-title {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: bold;
    }

    .section {
      background: #11151a;
      border: 1px solid #252a31;
      border-radius: 16px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .section-header {
      padding: 16px 18px;
      border-bottom: 1px solid #252a31;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
    }

    .section-body {
      padding: 18px;
    }

    .settings-row {
      display: flex;
      gap: 10px;
      align-items: end;
      max-width: 500px;
    }

    .settings-row .field {
      flex: 1;
      margin: 0;
    }

    /* Add product */
    .add-product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .add-product-grid .full {
      grid-column: 1 / -1;
    }

    .add-actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Products */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 15px;
    }

    .product-card {
      background: #0d1116;
      border: 1px solid #2a3038;
      border-radius: 14px;
      padding: 15px;
    }

    .product-top {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .product-image {
      width: 75px;
      height: 75px;
      object-fit: cover;
      border-radius: 10px;
      background: #181d24;
      border: 1px solid #303640;
      flex-shrink: 0;
    }

    .product-id {
      color: #64748b;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .product-name-title {
      font-weight: bold;
      line-height: 1.6;
    }

    .product-status {
      margin-top: 5px;
      font-size: 12px;
    }

    .status-active {
      color: #6ee7b7;
    }

    .status-inactive {
      color: #fca5a5;
    }

    .product-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .product-fields .full {
      grid-column: 1 / -1;
    }

    .product-fields .field {
      margin: 0;
    }

    .product-fields label {
      font-size: 11px;
      color: #94a3b8;
    }

    .product-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 13px;
      padding-top: 13px;
      border-top: 1px solid #252a31;
    }

    .stock-help {
      color: #64748b;
      font-size: 11px;
      margin-top: 4px;
    }

    .active-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #151a21;
      border: 1px solid #2a3038;
      border-radius: 8px;
      padding: 9px;
      height: 40px;
    }

    .active-toggle input {
      width: auto;
    }

    /* Orders */
    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1000px;
    }

    th,
    td {
      border-bottom: 1px solid #252a31;
      padding: 11px 9px;
      text-align: right;
      vertical-align: top;
      font-size: 13px;
    }

    th {
      color: #94a3b8;
      font-weight: normal;
      background: #0e1217;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .order-info {
      line-height: 1.9;
    }

    .tracking {
      color: #6ee7b7;
      font-weight: bold;
    }

    .order-actions {
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 150px;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: #64748b;
    }

    .loading {
      padding: 25px;
      text-align: center;
      color: #94a3b8;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .add-product-grid {
        grid-template-columns: 1fr;
      }

      .add-product-grid .full {
        grid-column: auto;
      }

      .products-grid {
        grid-template-columns: 1fr;
      }

      .settings-row {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginView">
    <div class="login-box">
      <h1>پنل مدیریت <span style="color:#6ee7b7">7BOX</span></h1>

      <div id="loginMessage" class="message"></div>

      <form id="loginForm">
        <div class="field">
          <label>نام کاربری</label>
          <input id="username" type="text" autocomplete="username" required>
        </div>

        <div class="field">
          <label>رمز عبور</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>

        <button class="btn" type="submit" style="width:100%">
          ورود به پنل
        </button>
      </form>
    </div>
  </div>

  <!-- ADMIN -->
  <div id="adminView" class="hidden">

    <header>
      <div class="container header-inner">
        <div class="brand">
          7<span>BOX</span> — مدیریت
        </div>

        <button class="btn red small" onclick="logout()">
          خروج
        </button>
      </div>
    </header>

    <main class="container">

      <div id="globalMessage" class="message"></div>

      <!-- STATS -->
      <div class="stats">
        <div class="stat">
          <div class="stat-title">تعداد محصولات</div>
          <div id="statProducts" class="stat-value">۰</div>
        </div>

        <div class="stat">
          <div class="stat-title">تعداد سفارش‌ها</div>
          <div id="statOrders" class="stat-value">۰</div>
        </div>

        <div class="stat">
          <div class="stat-title">سفارش‌های در انتظار</div>
          <div id="statPending" class="stat-value">۰</div>
        </div>
      </div>

      <!-- SETTINGS -->
      <section class="section">
        <div class="section-header">
          <div class="section-title">تنظیمات فروشگاه</div>
        </div>

        <div class="section-body">
          <div class="settings-row">
            <div class="field">
              <label>هزینه ارسال (تومان)</label>
              <input id="shippingCost" type="number" min="0">
            </div>

            <button class="btn green" onclick="saveShipping()">
              ذخیره هزینه ارسال
            </button>
          </div>
        </div>
      </section>

      <!-- ADD PRODUCT -->
      <section class="section">
        <div class="section-header">
          <div class="section-title">افزودن محصول جدید</div>
        </div>

        <div class="section-body">

          <form id="addProductForm">

            <div class="add-product-grid">

              <div class="field">
                <label>نام محصول</label>
                <input id="newName" type="text" required>
              </div>

              <div class="field">
                <label>دسته‌بندی</label>
                <input id="newCategory" type="text" required>
              </div>

              <div class="field full">
                <label>آدرس تصویر</label>
                <input id="newImage" type="text" placeholder="https://..." required>
              </div>

              <div class="field">
                <label>قیمت (تومان)</label>
                <input id="newPrice" type="number" min="0" placeholder="خالی = بدون قیمت">
              </div>

              <div class="field">
                <label>موجودی</label>
                <input id="newStock" type="number" min="0" placeholder="خالی = نامحدود">
                <div class="stock-help">
                  خالی = نامحدود، ۰ = ناموجود
                </div>
              </div>

              <div class="field full">
                <label>توضیحات</label>
                <textarea id="newDescription"></textarea>
              </div>

            </div>

            <div class="checkbox-field">
              <input id="newActive" type="checkbox" checked>
              <label for="newActive">محصول فعال باشد</label>
            </div>

            <div class="add-actions">
              <button class="btn green" type="submit">
                + افزودن محصول
              </button>

              <button class="btn gray" type="button" onclick="resetProductForm()">
                پاک کردن فرم
              </button>
            </div>

          </form>

        </div>
      </section>

      <!-- PRODUCTS -->
      <section class="section">
        <div class="section-header">
          <div class="section-title">مدیریت محصولات</div>

          <button class="btn gray small" onclick="loadProducts()">
            بروزرسانی
          </button>
        </div>

        <div class="section-body">
          <div id="productsContainer" class="products-grid">
            <div class="loading">در حال دریافت محصولات...</div>
          </div>
        </div>
      </section>

      <!-- ORDERS -->
      <section class="section">
        <div class="section-header">
          <div class="section-title">مدیریت سفارش‌ها</div>

          <button class="btn gray small" onclick="loadOrders()">
            بروزرسانی
          </button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>شناسه / پیگیری</th>
                <th>محصول</th>
                <th>مشتری</th>
                <th>مبلغ</th>
                <th>وضعیت</th>
                <th>یادداشت</th>
                <th>عملیات</th>
              </tr>
            </thead>

            <tbody id="ordersBody">
              <tr>
                <td colspan="7" class="loading">
                  در حال دریافت سفارش‌ها...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

<script>
  const STATUSES = [
    "ثبت سفارش",
    "تأیید سفارش",
    "بسته‌بندی",
    "ارسال",
    "تحویل",
    "لغو سفارش"
  ];

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function showMessage(id, text, type = "success") {
    const el = document.getElementById(id);

    if (!el) return;

    el.textContent = text;
    el.className = "message show " + type;

    setTimeout(() => {
      el.className = "message";
    }, 5000);
  }

  function toman(value) {
    if (value === null || value === undefined || value === "") {
      return "—";
    }

    return Number(value).toLocaleString("fa-IR") + " تومان";
  }

  function numberFa(value) {
    return Number(value || 0).toLocaleString("fa-IR");
  }

  async function api(url, options = {}) {
    const response = await fetch(url, {
      credentials: "include",
      ...options,
      headers: {
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    });

    let data = {};

    try {
      data = await response.json();
    } catch (_) {}

    if (!response.ok) {
      throw new Error(
        data.error ||
        data.message ||
        "خطایی در ارتباط با سرور رخ داد."
      );
    }

    return data;
  }

  /* =========================
     AUTH
  ========================= */

  async function checkLogin() {
    try {
      const data = await api("/api/admin/me");

      if (data && data.authenticated) {
        showAdmin();
      } else {
        showLogin();
      }
    } catch (_) {
      showLogin();
    }
  }

  function showLogin() {
    document.getElementById("loginView").classList.remove("hidden");
    document.getElementById("adminView").classList.add("hidden");
  }

  function showAdmin() {
    document.getElementById("loginView").classList.add("hidden");
    document.getElementById("adminView").classList.remove("hidden");

    loadAll();
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    try {
      await api("/api/admin/login", {
        method: "POST",
        body: JSON.stringify({
          username,
          password
        })
      });

      showAdmin();

    } catch (error) {
      showMessage(
        "loginMessage",
        error.message,
        "error"
      );
    }
  });

  async function logout() {
    try {
      await api("/api/admin/logout", {
        method: "POST"
      });
    } catch (_) {}

    showLogin();
  }

  /* =========================
     LOAD ALL
  ========================= */

  async function loadAll() {
    await Promise.all([
      loadSettings(),
      loadProducts(),
      loadOrders()
    ]);
  }

  /* =========================
     SETTINGS
  ========================= */

  async function loadSettings() {
    try {
      const data = await api("/api/admin/settings");

      const settings = data.settings || data || {};

      if (settings.shipping_cost !== undefined) {
        document.getElementById("shippingCost").value =
          settings.shipping_cost;
      }

    } catch (error) {
      showMessage("globalMessage", error.message, "error");
    }
  }

  async function saveShipping() {
    const value = document
      .getElementById("shippingCost")
      .value;

    if (value === "" || Number(value) < 0) {
      showMessage(
        "globalMessage",
        "هزینه ارسال معتبر نیست.",
        "error"
      );
      return;
    }

    try {
      await api("/api/admin/settings", {
        method: "PUT",
        body: JSON.stringify({
          shipping_cost: Number(value)
        })
      });

      showMessage(
        "globalMessage",
        "هزینه ارسال با موفقیت ذخیره شد."
      );

    } catch (error) {
      showMessage(
        "globalMessage",
        error.message,
        "error"
      );
    }
  }

  /* =========================
     PRODUCTS
  ========================= */

  async function loadProducts() {
    const container =
      document.getElementById("productsContainer");

    container.innerHTML =
      '<div class="loading">در حال دریافت محصولات...</div>';

    try {
      const data = await api("/api/admin/products");

      const products =
        Array.isArray(data)
          ? data
          : (data.products || []);

      document.getElementById("statProducts").textContent =
        numberFa(products.length);

      if (!products.length) {
        container.innerHTML =
          '<div class="empty">هنوز محصولی ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = products.map(productCard).join("");

    } catch (error) {
      container.innerHTML =
        '<div class="empty">خطا در دریافت محصولات.</div>';

      showMessage(
        "globalMessage",
        error.message,
        "error"
      );
    }
  }

  function productCard(product) {
    const id = Number(product.id);

    const stockValue =
      product.stock === null ||
      product.stock === undefined
        ? ""
        : product.stock;

    const active =
      Number(product.active) === 1;

    const stockText =
      product.stock === null ||
      product.stock === undefined
        ? "نامحدود"
        : Number(product.stock) === 0
          ? "ناموجود"
          : numberFa(product.stock);

    return `
      <div class="product-card">

        <div class="product-top">

          <img
            class="product-image"
            src="${escapeHtml(product.image)}"
            alt="${escapeHtml(product.name)}"
            onerror="this.style.opacity='.25'"
          >

          <div>
            <div class="product-id">
              محصول #${numberFa(id)}
            </div>

            <div class="product-name-title">
              ${escapeHtml(product.name)}
            </div>

            <div class="product-status ${
              active
                ? "status-active"
                : "status-inactive"
            }">
              ${active ? "● فعال" : "● غیرفعال"}
              — موجودی: ${stockText}
            </div>
          </div>

        </div>

        <div class="product-fields">

          <div class="field">
            <label>نام محصول</label>
            <input
              id="product-name-${id}"
              value="${escapeHtml(product.name)}"
            >
          </div>

          <div class="field">
            <label>دسته‌بندی</label>
            <input
              id="product-category-${id}"
              value="${escapeHtml(product.category)}"
            >
          </div>

          <div class="field full">
            <label>آدرس تصویر</label>
            <input
              id="product-image-${id}"
              value="${escapeHtml(product.image)}"
            >
          </div>

          <div class="field">
            <label>قیمت (تومان)</label>
            <input
              id="product-price-${id}"
              type="number"
              min="0"
              value="${
                product.price === null ||
                product.price === undefined
                  ? ""
                  : escapeHtml(product.price)
              }"
            >
          </div>

          <div class="field">
            <label>موجودی</label>
            <input
              id="product-stock-${id}"
              type="number"
              min="0"
              value="${escapeHtml(stockValue)}"
              placeholder="نامحدود"
            >
            <div class="stock-help">
              خالی = نامحدود
            </div>
          </div>

          <div class="field full">
            <label>توضیحات</label>
            <textarea
              id="product-description-${id}"
            >${escapeHtml(product.description)}</textarea>
          </div>

          <div class="field full">
            <label>وضعیت محصول</label>

            <div class="active-toggle">
              <input
                id="product-active-${id}"
                type="checkbox"
                ${active ? "checked" : ""}
              >

              <label for="product-active-${id}">
                محصول در فروشگاه فعال باشد
              </label>
            </div>
          </div>

        </div>

        <div class="product-actions">

          <button
            class="btn green small"
            onclick="saveProduct(${id})"
          >
            ذخیره تغییرات
          </button>

          <button
            class="btn red small"
            onclick="deleteProduct(${id}, '${escapeHtml(product.name)}')"
          >
            حذف محصول
          </button>

        </div>

      </div>
    `;
  }

  function getNullableNumber(id) {
    const value = document.getElementById(id).value.trim();

    if (value === "") {
      return null;
    }

    const number = Number(value);

    if (!Number.isInteger(number) || number < 0) {
      throw new Error("مقدار عددی واردشده معتبر نیست.");
    }

    return number;
  }

  async function saveProduct(id) {
    try {
      const name =
        document.getElementById(
          `product-name-${id}`
        ).value.trim();

      const category =
        document.getElementById(
          `product-category-${id}`
        ).value.trim();

      const image =
        document.getElementById(
          `product-image-${id}`
        ).value.trim();

      const description =
        document.getElementById(
          `product-description-${id}`
        ).value.trim();

      const price =
        getNullableNumber(`product-price-${id}`);

      const stock =
        getNullableNumber(`product-stock-${id}`);

      const active =
        document.getElementById(
          `product-active-${id}`
        ).checked;

      if (!name) {
        throw new Error("نام محصول را وارد کنید.");
      }

      if (!category) {
        throw new Error("دسته‌بندی محصول را وارد کنید.");
      }

      if (!image) {
        throw new Error("آدرس تصویر را وارد کنید.");
      }

      await api("/api/admin/products", {
        method: "PUT",
        body: JSON.stringify({
          id,
          name,
          image,
          category,
          description,
          price,
          stock,
          active
        })
      });

      showMessage(
        "globalMessage",
        "محصول با موفقیت بروزرسانی شد."
      );

      await loadProducts();

    } catch (error) {
      showMessage(
        "globalMessage",
        error.message,
        "error"
      );
    }
  }

  document
    .getElementById("addProductForm")
    .addEventListener("submit", async (e) => {

      e.preventDefault();

      try {
        const name =
          document.getElementById("newName")
            .value.trim();

        const category =
          document.getElementById("newCategory")
            .value.trim();

        const image =
          document.getElementById("newImage")
            .value.trim();

        const description =
          document.getElementById("newDescription")
            .value.trim();

        const price =
          getNullableNumber("newPrice");

        const stock =
          getNullableNumber("newStock");

        const active =
          document.getElementById("newActive")
            .checked;

        if (!name) {
          throw new Error("نام محصول را وارد کنید.");
        }

        if (!category) {
          throw new Error("دسته‌بندی محصول را وارد کنید.");
        }

        if (!image) {
          throw new Error("آدرس تصویر را وارد کنید.");
        }

        await api("/api/admin/products", {
          method: "POST",
          body: JSON.stringify({
            name,
            image,
            category,
            description,
            price,
            stock,
            active
          })
        });

        showMessage(
          "globalMessage",
          "محصول جدید با موفقیت اضافه شد."
        );

        resetProductForm();

        await loadProducts();

      } catch (error) {
        showMessage(
          "globalMessage",
          error.message,
          "error"
        );
      }
    });

  function resetProductForm() {
    document.getElementById("addProductForm").reset();

    document.getElementById("newActive").checked = true;
  }

  async function deleteProduct(id, name) {
    const confirmed = confirm(
      `آیا از حذف محصول «${name}» مطمئن هستید؟\n\nاگر این محصول سفارش ثبت‌شده داشته باشد، سرور اجازه حذف نمی‌دهد.`
    );

    if (!confirmed) {
      return;
    }

    try {
      await api("/api/admin/products", {
        method: "DELETE",
        body: JSON.stringify({
          id
        })
      });

      showMessage(
        "globalMessage",
        "محصول حذف شد."
      );

      await loadProducts();

    } catch (error) {
      showMessage(
        "globalMessage",
        error.message,
        "error"
      );
    }
  }

  /* =========================
     ORDERS
  ========================= */

  async function loadOrders() {
    const body =
      document.getElementById("ordersBody");

    body.innerHTML = `
      <tr>
        <td colspan="7" class="loading">
          در حال دریافت سفارش‌ها...
        </td>
      </tr>
    `;

    try {
      const data = await api("/api/admin/orders");

      const orders =
        Array.isArray(data)
          ? data
          : (data.orders || []);

      document.getElementById("statOrders").textContent =
        numberFa(orders.length);

      const pending =
        orders.filter(order =>
          order.status !== "تحویل" &&
          order.status !== "لغو سفارش"
        ).length;

      document.getElementById("statPending").textContent =
        numberFa(pending);

      if (!orders.length) {
        body.innerHTML = `
          <tr>
            <td colspan="7" class="empty">
              سفارشی وجود ندارد.
            </td>
          </tr>
        `;
        return;
      }

      body.innerHTML =
        orders.map(orderRow).join("");

    } catch (error) {
      body.innerHTML = `
        <tr>
          <td colspan="7" class="empty">
            خطا در دریافت سفارش‌ها.
          </td>
        </tr>
      `;

      showMessage(
        "globalMessage",
        error.message,
        "error"
      );
    }
  }

  function orderRow(order) {
    const id = Number(order.id);

    const statusOptions =
      STATUSES.map(status => `
        <option
          value="${escapeHtml(status)}"
          ${
            status === order.status
              ? "selected"
              : ""
          }
        >
          ${escapeHtml(status)}
        </option>
      `).join("");

    return `
      <tr>

        <td>
          <div class="order-info">
            <div>
              #${numberFa(id)}
            </div>

            <div class="tracking">
              ${escapeHtml(order.tracking_code)}
            </div>

            <div style="color:#64748b;font-size:11px">
              ${escapeHtml(order.created_at || "")}
            </div>
          </div>
        </td>

        <td>
          <div class="order-info">
            <strong>
              ${escapeHtml(order.product_name)}
            </strong>

            <div>
              تعداد:
              ${numberFa(order.quantity)}
            </div>

            <div>
              قیمت واحد:
              ${toman(order.unit_price)}
            </div>
          </div>
        </td>

        <td>
          <div class="order-info">
            <strong>
              ${escapeHtml(order.customer_name)}
            </strong>

            <div>
              ${escapeHtml(order.phone)}
            </div>

            <div>
              ${escapeHtml(order.province)}
              -
              ${escapeHtml(order.city)}
            </div>

            <div>
              ${escapeHtml(order.address)}
            </div>

            <div>
              کدپستی:
              ${escapeHtml(order.postal_code)}
            </div>
          </div>
        </td>

        <td>
          <div class="order-info">
            <strong>
              ${toman(order.total_amount)}
            </strong>

            <div>
              ارسال:
              ${toman(order.shipping_cost)}
            </div>
          </div>
        </td>

        <td>
          <select id="order-status-${id}">
            ${statusOptions}
          </select>
        </td>

        <td>
          <textarea
            id="order-note-${id}"
            placeholder="یادداشت مدیر"
            style="min-width:180px"
          >${escapeHtml(order.admin_note || "")}</textarea>
        </td>

        <td>
          <div class="order-actions">

            <button
              class="btn green small"
              onclick="saveOrder(${id})"
            >
              ذخیره
            </button>

            <button
              class="btn red small"
              onclick="deleteOrder(${id})"
            >
              حذف سفارش
            </button>

          </div>
        </td>

      </tr>
    `;
  }

  async function saveOrder(id) {
    try {
      const status =
        document.getElementById(
          `order-status-${id}`
        ).value;

      const note =
        document.getElementById(
          `order-note-${id}`
        ).value;

      await api("/api/admin/orders/status", {
        method: "PUT",
        body: JSON.stringify({
          id,
          status
        })
      });

      await api("/api/admin/orders/note", {
        method: "PUT",
        body: JSON.stringify({
          id,
          note
        })
      });

      showMessage(
        "globalMessage",
        "سفارش با موفقیت بروزرسانی شد."
      );

      await loadOrders();

    } catch (error) {
      showMessage(
        "globalMessage",
        error.message,
        "error"
      );
    }
  }

  async function deleteOrder(id) {
    const confirmed = confirm(
      "آیا از حذف این سفارش مطمئن هستید؟"
    );

    if (!confirmed) {
      return;
    }

    try {
      await api("/api/admin/orders", {
        method: "DELETE",
        body: JSON.stringify({
          id
        })
      });

      showMessage(
        "globalMessage",
        "سفارش حذف شد."
      );

      await loadOrders();

    } catch (error) {
      showMessage(
        "globalMessage",
        error.message,
        "error"
      );
    }
  }

  /* =========================
     START
  ========================= */

  checkLogin();
</script>

</body>
</html>
