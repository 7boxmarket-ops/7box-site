<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت 7BOX</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(185,255,208,.08), transparent 35%),
        #050706;
      color: #f4f7f5;
      font-family: Tahoma, Arial, sans-serif;
    }

    button, input, textarea, select {
      font-family: inherit;
    }

    .page {
      width: min(1200px, 100%);
      margin: auto;
      padding: 20px 14px 60px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .logo {
      color: #b9ffd0;
      font-weight: 900;
      font-size: 25px;
      letter-spacing: 1px;
    }

    .logout {
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.04);
      color: #fff;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
    }

    .title {
      font-size: 30px;
      margin: 8px 0;
    }

    .subtitle {
      color: #9fa9a2;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .login {
      width: min(420px, 100%);
      margin: 12vh auto;
      padding: 25px;
      border-radius: 22px;
      background: rgba(14,17,15,.95);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 25px 80px rgba(0,0,0,.4);
    }

    .login h1 {
      text-align: center;
      margin-top: 0;
      color: #b9ffd0;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      color: #bdc7c0;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border-radius: 11px;
      border: 1px solid rgba(255,255,255,.1);
      background: #0a0c0b;
      color: #fff;
      padding: 12px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: rgba(185,255,208,.45);
    }

    .btn {
      border: 0;
      border-radius: 11px;
      padding: 12px 17px;
      cursor: pointer;
      font-weight: 900;
    }

    .primary {
      width: 100%;
      background: #b9ffd0;
      color: #061008;
    }

    .save {
      background: #b9ffd0;
      color: #061008;
    }

    .refresh {
      background: rgba(255,255,255,.07);
      color: #fff;
      border: 1px solid rgba(255,255,255,.1);
    }

    .dashboard {
      display: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      padding: 18px;
      border-radius: 17px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.07);
    }

    .stat-label {
      color: #929b95;
      font-size: 12px;
    }

    .stat-value {
      margin-top: 8px;
      font-size: 25px;
      font-weight: 900;
      color: #b9ffd0;
    }

    .panel {
      padding: 18px;
      border-radius: 19px;
      background: rgba(13,16,14,.93);
      border: 1px solid rgba(255,255,255,.07);
      margin-bottom: 18px;
      overflow: hidden;
    }

    .panel h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .shipping {
      display: flex;
      align-items: end;
      gap: 12px;
      max-width: 500px;
    }

    .shipping .field {
      flex: 1;
      margin: 0;
    }

    .product-table,
    .orders {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
    }

    th,
    td {
      text-align: right;
      padding: 12px 9px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      font-size: 12px;
      vertical-align: middle;
    }

    th {
      color: #b9ffd0;
      font-size: 12px;
    }

    td {
      color: #c4ccc7;
    }

    .product-thumb {
      width: 48px;
      height: 48px;
      object-fit: contain;
      background: #090a0a;
      border-radius: 8px;
    }

    .price-input {
      width: 150px;
    }

    .status-select {
      min-width: 145px;
    }

    .note-input {
      min-width: 200px;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 11px;
      margin-bottom: 15px;
      font-size: 13px;
    }

    .success {
      display: block;
      background: rgba(100,255,150,.07);
      color: #b9ffd0;
      border: 1px solid rgba(100,255,150,.15);
    }

    .error {
      display: block;
      background: rgba(255,80,80,.07);
      color: #ffb0b0;
      border: 1px solid rgba(255,80,80,.15);
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: #7f8982;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .shipping {
        flex-direction: column;
        align-items: stretch;
      }

      .title {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<section id="loginSection" class="login">

  <h1>7BOX</h1>

  <p style="text-align:center;color:#929b95;font-size:13px;">
    ورود به پنل مدیریت
  </p>

  <div id="loginMessage" class="message"></div>

  <form id="loginForm">

    <div class="field">
      <label for="password">رمز مدیریت</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required>
    </div>

    <button class="btn primary" type="submit">
      ورود به پنل
    </button>

  </form>

</section>


<main id="dashboard" class="page dashboard">

  <div class="topbar">

    <div class="logo">
      7BOX ADMIN
    </div>

    <button id="logoutBtn" class="logout">
      خروج
    </button>

  </div>

  <h1 class="title">
    پنل مدیریت
  </h1>

  <div class="subtitle">
    مدیریت قیمت محصولات، هزینه ارسال و سفارش‌های ثبت‌شده
  </div>

  <div id="globalMessage" class="message"></div>


  <section class="stats">

    <div class="stat">
      <div class="stat-label">
        تعداد محصولات
      </div>

      <div id="statProducts" class="stat-value">
        ۰
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">
        تعداد سفارش‌ها
      </div>

      <div id="statOrders" class="stat-value">
        ۰
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">
        در انتظار بررسی
      </div>

      <div id="statPending" class="stat-value">
        ۰
      </div>
    </div>

  </section>


  <section class="panel">

    <h2>🚚 هزینه ارسال</h2>

    <div class="shipping">

      <div class="field">

        <label for="shippingCost">
          هزینه ارسال به ازای هر واحد
        </label>

        <input
          id="shippingCost"
          type="number"
          min="0"
          step="1000">

      </div>

      <button
        id="saveShipping"
        class="btn save">
        ذخیره
      </button>

    </div>

  </section>


  <section class="panel">

    <h2>💰 قیمت محصولات</h2>

    <div class="product-table">

      <table>

        <thead>

          <tr>
            <th>تصویر</th>
            <th>محصول</th>
            <th>قیمت</th>
            <th>عملیات</th>
          </tr>

        </thead>

        <tbody id="productsBody"></tbody>

      </table>

    </div>

  </section>


  <section class="panel">

    <h2>📦 سفارش‌ها</h2>

    <div style="margin-bottom:15px;">

      <button
        id="refreshOrders"
        class="btn refresh">
        بروزرسانی سفارش‌ها
      </button>

    </div>

    <div class="orders">

      <table>

        <thead>

          <tr>
            <th>رهگیری</th>
            <th>محصول</th>
            <th>مشتری</th>
            <th>مبلغ</th>
            <th>وضعیت</th>
            <th>یادداشت</th>
            <th>ثبت</th>
          </tr>

        </thead>

        <tbody id="ordersBody"></tbody>

      </table>

    </div>

  </section>

</main>


<script>

const STATUSES = [
  "ثبت سفارش",
  "تأیید سفارش",
  "بسته‌بندی",
  "ارسال",
  "تحویل",
  "لغو سفارش"
];


const loginSection =
  document.getElementById("loginSection");

const dashboard =
  document.getElementById("dashboard");

const loginForm =
  document.getElementById("loginForm");

const loginMessage =
  document.getElementById("loginMessage");

const globalMessage =
  document.getElementById("globalMessage");


function showLoginMessage(text, type) {

  loginMessage.className =
    "message " + type;

  loginMessage.textContent = text;
}


function showMessage(text, type) {

  globalMessage.className =
    "message " + type;

  globalMessage.textContent = text;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


async function api(url, options = {}) {

  const response = await fetch(
    url,
    {
      credentials: "same-origin",
      cache: "no-store",
      ...options
    }
  );

  let data = null;

  try {
    data = await response.json();
  } catch {}

  if (response.status === 401) {

    showLogin();

    throw new Error("AUTH");
  }

  if (!response.ok || !data?.ok) {

    throw new Error(
      data?.error ||
      "خطا در ارتباط با سرور"
    );
  }

  return data;
}


async function checkLogin() {

  try {

    const response =
      await fetch(
        "/api/admin/me",
        {
          credentials: "same-origin",
          cache: "no-store"
        }
      );

    if (response.ok) {

      showDashboard();

    } else {

      showLogin();

    }

  } catch {

    showLogin();

  }
}


function showLogin() {

  loginSection.style.display =
    "block";

  dashboard.style.display =
    "none";
}


function showDashboard() {

  loginSection.style.display =
    "none";

  dashboard.style.display =
    "block";

  loadDashboard();
}


loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const password =
      document.getElementById(
        "password"
      ).value;

    try {

      const response =
        await fetch(
          "/api/admin/login",
          {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type":
                "application/json"
            },
            body:
              JSON.stringify({
                password
              })
          }
        );

      const data =
        await response.json();

      if (!response.ok || !data.ok) {

        throw new Error(
          data?.error ||
          "ورود ناموفق بود."
        );
      }

      document.getElementById(
        "password"
      ).value = "";

      showDashboard();

    } catch (error) {

      showLoginMessage(
        error.message,
        "error"
      );
    }

  }
);


document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async function() {

      await fetch(
        "/api/admin/logout",
        {
          method: "POST",
          credentials: "same-origin"
        }
      );

      showLogin();

    }
  );


async function loadDashboard() {

  try {

    await Promise.all([
      loadProducts(),
      loadSettings(),
      loadOrders()
    ]);

  } catch (error) {

    if (error.message !== "AUTH") {

      showMessage(
        error.message,
        "error"
      );
    }
  }
}


async function loadProducts() {

  const data =
    await api(
      "/api/admin/products"
    );

  const products =
    data.products || [];

  document.getElementById(
    "statProducts"
  ).textContent =
    products.length.toLocaleString(
      "fa-IR"
    );

  const body =
    document.getElementById(
      "productsBody"
    );

  if (!products.length) {

    body.innerHTML =
      `<tr>
        <td colspan="4" class="empty">
          محصولی وجود ندارد.
        </td>
      </tr>`;

    return;
  }

  body.innerHTML =
    products.map(product => {

      const price =
        product.price === null ||
        product.price === undefined
          ? ""
          : product.price;

      return `
        <tr>

          <td>
            <img
              class="product-thumb"
              src="${escapeHtml(product.image)}"
              alt="">
          </td>

          <td>
            ${escapeHtml(product.name)}
          </td>

          <td>

            <input
              class="price-input"
              type="number"
              min="0"
              step="1000"
              value="${price}"
              data-price-id="${product.id}"
              placeholder="استعلام">

          </td>

          <td>

            <button
              class="btn save"
              onclick="saveProduct(${product.id})">

              ذخیره

            </button>

          </td>

        </tr>
      `;

    }).join("");
}


async function saveProduct(id) {

  const input =
    document.querySelector(
      `[data-price-id="${id}"]`
    );

  if (!input) return;

  const value =
    input.value.trim();

  const price =
    value === ""
      ? null
      : Number(value);

  try {

    await api(
      "/api/admin/products",
      {
        method: "PUT",
        headers: {
          "Content-Type":
            "application/json"
        },
        body:
          JSON.stringify({
            id,
            price
          })
      }
    );

    showMessage(
      "قیمت محصول با موفقیت ذخیره شد.",
      "success"
    );

    await loadProducts();

  } catch (error) {

    if (error.message !== "AUTH") {

      showMessage(
        error.message,
        "error"
      );
    }
  }
}


async function loadSettings() {

  const data =
    await api(
      "/api/admin/settings"
    );

  const shipping =
    Number(
      data?.settings?.shipping_cost
    );

  document.getElementById(
    "shippingCost"
  ).value =
    Number.isFinite(shipping)
      ? shipping
      : 300000;
}


document
  .getElementById("saveShipping")
  .addEventListener(
    "click",
    async function() {

      const value =
        Number(
          document.getElementById(
            "shippingCost"
          ).value
        );

      if (!Number.isFinite(value) || value < 0) {

        showMessage(
          "هزینه ارسال نامعتبر است.",
          "error"
        );

        return;
      }

      try {

        await api(
          "/api/admin/settings",
          {
            method: "PUT",
            headers: {
              "Content-Type":
                "application/json"
            },
            body:
              JSON.stringify({
                shipping_cost: value
              })
          }
        );

        showMessage(
          "هزینه ارسال ذخیره شد.",
          "success"
        );

      } catch (error) {

        if (error.message !== "AUTH") {

          showMessage(
            error.message,
            "error"
          );
        }
      }

    }
  );


async function loadOrders() {

  const data =
    await api(
      "/api/admin/orders"
    );

  const orders =
    data.orders || [];

  document.getElementById(
    "statOrders"
  ).textContent =
    orders.length.toLocaleString(
      "fa-IR"
    );

  const pending =
    orders.filter(
      order =>
        order.status ===
        "ثبت سفارش"
    ).length;

  document.getElementById(
    "statPending"
  ).textContent =
    pending.toLocaleString(
      "fa-IR"
    );

  const body =
    document.getElementById(
      "ordersBody"
    );

  if (!orders.length) {

    body.innerHTML =
      `<tr>
        <td colspan="7" class="empty">
          هنوز سفارشی ثبت نشده است.
        </td>
      </tr>`;

    return;
  }

  body.innerHTML =
    orders.map(order => {

      const statusOptions =
        STATUSES.map(status => `
          <option
            value="${escapeHtml(status)}"
            ${
              status === order.status
                ? "selected"
                : ""
            }>
            ${escapeHtml(status)}
          </option>
        `).join("");

      const safeCode =
        cssSafe(
          order.tracking_code
        );

      return `
        <tr>

          <td dir="ltr">
            ${escapeHtml(
              order.tracking_code
            )}
          </td>

          <td>

            ${escapeHtml(
              order.product_name
            )}

            <br>

            <small>
              تعداد:
              ${
                Number(
                  order.quantity
                ).toLocaleString(
                  "fa-IR"
                )
              }
            </small>

          </td>

          <td>

            ${escapeHtml(
              order.customer_name
            )}

            <br>

            ${escapeHtml(
              order.phone
            )}

            <br>

            ${escapeHtml(
              order.province
            )}
            -
            ${escapeHtml(
              order.city
            )}

          </td>

          <td>

            ${
              Number(
                order.total_amount || 0
              ).toLocaleString(
                "fa-IR"
              )
            }

            تومان

          </td>

          <td>

            <select
              class="status-select"
              id="status-${safeCode}">

              ${statusOptions}

            </select>

          </td>

          <td>

            <input
              class="note-input"
              id="note-${safeCode}"
              value="${escapeHtml(
                order.admin_note || ""
              )}"
              placeholder="یادداشت">

          </td>

          <td>

            <button
              class="btn save"
              onclick="saveOrder('${escapeJs(
                order.tracking_code
              )}')">

              ذخیره

            </button>

          </td>

        </tr>
      `;

    }).join("");
}


async function saveOrder(trackingCode) {

  const safe =
    cssSafe(trackingCode);

  const statusElement =
    document.getElementById(
      `status-${safe}`
    );

  const noteElement =
    document.getElementById(
      `note-${safe}`
    );

  if (!statusElement || !noteElement) {
    return;
  }

  const status =
    statusElement.value;

  const note =
    noteElement.value;

  try {

    await api(
      "/api/admin/orders/status",
      {
        method: "PUT",
        headers: {
          "Content-Type":
            "application/json"
        },
        body:
          JSON.stringify({
            tracking_code:
              trackingCode,
            status
          })
      }
    );

    await api(
      "/api/admin/orders/note",
      {
        method: "PUT",
        headers: {
          "Content-Type":
            "application/json"
        },
        body:
          JSON.stringify({
            tracking_code:
              trackingCode,
            admin_note:
              note
          })
      }
    );

    showMessage(
      "سفارش با موفقیت بروزرسانی شد.",
      "success"
    );

    await loadOrders();

  } catch (error) {

    if (error.message !== "AUTH") {

      showMessage(
        error.message,
        "error"
      );
    }
  }
}


document
  .getElementById("refreshOrders")
  .addEventListener(
    "click",
    async function() {

      try {

        await loadOrders();

        showMessage(
          "سفارش‌ها بروزرسانی شدند.",
          "success"
        );

      } catch (error) {

        if (error.message !== "AUTH") {

          showMessage(
            error.message,
            "error"
          );
        }
      }

    }
  );


function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function escapeJs(value) {

  return String(value ?? "")
    .replaceAll("\\", "\\\\")
    .replaceAll("'", "\\'")
    .replaceAll("\n", "\\n")
    .replaceAll("\r", "\\r");
}


function cssSafe(value) {

  return String(value ?? "")
    .replace(
      /[^a-zA-Z0-9_-]/g,
      "_"
    );
}


checkLogin();

</script>

</body>
</html>
