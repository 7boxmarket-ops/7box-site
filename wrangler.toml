name = "7box-site"
main = "worker.js"
compatibility_date = "2026-10-01"
keep_vars = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*", "/*.png", "/*.jpg", "/*.jpeg"]

[[d1_databases]]
binding = "DB"
database_name = "sevenbox-orders"
database_id = "b0668796-5d2e-4777-92bd-a8e5c637d89f"

